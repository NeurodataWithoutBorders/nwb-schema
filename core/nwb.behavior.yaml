groups:
- neurodata_type_def: SpatialSeries
  neurodata_type_inc: TimeSeries
  doc: "Direction, e.g., of gaze or travel, or position. The TimeSeries::data field\
    \ is a 2D array storing position or direction relative to some reference frame.\
    \ Array structure: [num measurements] [num dimensions]. Each SpatialSeries has\
    \ a text dataset reference_frame that indicates the zero-position, or the zero-axes\
    \ for direction. For example, if representing gaze direction, 'straight-ahead'\
    \ might be a specific pixel on the monitor, or some other point in space. For\
    \ position data, the 0,0 point might be the top-left corner of an enclosure, as\
    \ viewed from the tracking camera. The unit of data will indicate how to interpret\
    \ SpatialSeries values."
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_times
    - - num_times
      - x
    - - num_times
      - x,y
    - - num_times
      - x,y,z
    shape:
    - - null
    - - null
      - 1
    - - null
      - 2
    - - null
      - 3
    doc: 1-D or 2-D array storing position or direction relative to some reference frame.
    attributes:
    - name: unit
      dtype: text
      default_value: meters
      doc: Base unit of measurement for working with the data. The default value
        is 'meters'. Actual stored values are not necessarily stored in these units.
        To access the data in these units, multiply 'data' by 'conversion' and add 'offset'.
      required: false
  - name: reference_frame
    dtype: text
    doc: Description defining what exactly 'straight-ahead' means.
    quantity: '?'

- neurodata_type_def: PositionSeries
  neurodata_type_inc: SpatialSeries
  doc: Specialized SpatialSeries for tracking the spatial position/location of a subject
    or object over time. Stores coordinates in 1D, 2D, or 3D space. Common use cases
    include tracking animal position in an arena during behavioral experiments
    or recording object positions in the environment.
    The reference_frame field should specify the coordinate system and origin. Example
    reference frames might be 'origin at top-left corner of arena, x-axis pointing
    right, y-axis pointing down, as viewed from above' for 2D arena tracking, or 'origin
    at center of experimental chamber, x-axis pointing East, y-axis pointing North,
    z-axis pointing up' for 3D tracking. Units should be in spatial measurements (e.g.,
    meters, centimeters, pixels).
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_times
    - - num_times
      - x
    - - num_times
      - x,y
    - - num_times
      - x,y,z
    shape:
    - - null
    - - null
      - 1
    - - null
      - 2
    - - null
      - 3
    doc: 1-D or 2-D array storing position data. First dimension is time, and the remaining
      dimension(s) represent spatial coordinates.
    attributes:
    - name: unit
      dtype: text
      default_value: meters
      doc: Base unit of measurement for position data. Common values are 'meters',
        'centimeters', or 'pixels'. 
      required: false

- neurodata_type_def: CompassDirectionSeries
  neurodata_type_inc: SpatialSeries
  doc: Specialized SpatialSeries for tracking directional heading or compass direction
    of a subject (typically head direction in navigation studies). Stores a floating
    point value representing theta (heading angle). The reference_frame field should
    indicate what direction corresponds to 0 degrees/radians and specify the direction
    of rotation (clockwise is standard). Units should be 'radians' or 'degrees'. Example
    reference frames might be '0 radians is facing the reward port, rotation is clockwise
    when viewed from above' or '0 degrees corresponds to magnetic North'.
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_times
    - - num_times
      - theta
    shape:
    - - null
    - - null
      - 1
    doc: 1-D or 2-D array storing heading/compass direction. Typically stores a single
      angular value (theta) per timepoint.
    attributes:
    - name: unit
      dtype: text
      default_value: radians
      doc: Base unit of measurement for direction data. Should be 'radians' or 'degrees'.
      required: false

- neurodata_type_def: EyeTrackingSeries
  neurodata_type_inc: SpatialSeries
  doc: Specialized SpatialSeries for tracking gaze location or eye position. Eye tracking
    measures where the subject is looking, which can be represented in different coordinate
    systems depending on the experimental setup. Common representations include (1)
    gaze position on a screen/monitor in pixels or screen coordinates, (2) eye rotation
    angles relative to the head (horizontal and vertical), or (3) gaze position in
    world coordinates. The reference_frame field should specify the coordinate system.
    Example reference frames might be 'gaze position in pixels, origin at top-left
    corner of screen, x-axis pointing right, y-axis pointing down' for screen-based
    tracking, or 'eye rotation angles in degrees, origin at straight ahead from head,
    positive x is rightward, positive y is upward' for head-centered coordinates.
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_times
    - - num_times
      - x
    - - num_times
      - x,y
    - - num_times
      - x,y,z
    shape:
    - - null
    - - null
      - 1
    - - null
      - 2
    - - null
      - 3
    doc: 1-D or 2-D array storing gaze direction. Typically 2D (x,y gaze angles or
      screen coordinates), but can be 1D or 3D.
    attributes:
    - name: unit
      dtype: text
      default_value: degrees
      doc: Base unit of measurement for gaze direction. Common values are 'degrees',
        'radians', or 'pixels'. 
      required: false

- neurodata_type_def: BehavioralEpochs
  neurodata_type_inc: NWBDataInterface
  default_name: BehavioralEpochs
  doc: TimeSeries for storing behavioral epochs.  The objective of this and the other
    two Behavioral interfaces (e.g. BehavioralEvents and BehavioralTimeSeries) is
    to provide generic hooks for software tools/scripts. This allows a tool/script
    to take the output one specific interface (e.g., UnitTimes) and plot that data
    relative to another data modality (e.g., behavioral events) without having to
    define all possible modalities in advance. Declaring one of these interfaces means
    that one or more TimeSeries of the specified type is published. These TimeSeries
    should reside in a group having the same name as the interface. For example, if
    a BehavioralTimeSeries interface is declared, the module will have one or more
    TimeSeries defined in the module sub-group 'BehavioralTimeSeries'. BehavioralEpochs
    should use IntervalSeries. BehavioralEvents is used for irregular events. BehavioralTimeSeries
    is for continuous data.
  groups:
  - neurodata_type_inc: IntervalSeries
    doc: IntervalSeries object containing start and stop times of epochs.
    quantity: '+'

- neurodata_type_def: BehavioralEvents
  neurodata_type_inc: NWBDataInterface
  default_name: BehavioralEvents
  doc: TimeSeries for storing behavioral events. See description of BehavioralEpochs
    for more details.
  groups:
  - neurodata_type_inc: TimeSeries
    doc: TimeSeries object containing behavioral events.
    quantity: '+'

- neurodata_type_def: BehavioralTimeSeries
  neurodata_type_inc: NWBDataInterface
  default_name: BehavioralTimeSeries
  doc: TimeSeries for storing behavioral time series data. See description of BehavioralEpochs
    for more details.
  groups:
  - neurodata_type_inc: TimeSeries
    doc: TimeSeries object containing continuous behavioral data.
    quantity: '+'

- neurodata_type_def: PupilTrackingSeries
  neurodata_type_inc: TimeSeries
  doc: Specialized TimeSeries for tracking pupil size/diameter over time. Stores
    scalar measurements of pupil diameter or area for a single pupil. For tracking
    both eyes, use two separate PupilTrackingSeries instances (e.g., one for left
    eye, one for right eye). Units should be in length measurements (e.g., millimeters,
    pixels) or arbitrary units with appropriate conversion factors.
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_times
    shape:
    - - null
    doc: 1-D array storing pupil size data over time.
    attributes:
    - name: unit
      dtype: text
      default_value: millimeters
      doc: Base unit of measurement for pupil size. Common values are 'millimeters',
        'pixels', or 'arbitrary units'.
      required: false

- neurodata_type_def: PupilTracking
  neurodata_type_inc: NWBDataInterface
  default_name: PupilTracking
  doc: Eye-tracking data, representing pupil size. WARNING - Use the specialized
    PupilTrackingSeries type for new data, which provides explicit semantics and
    appropriate default units for pupil size measurements.
  groups:
  - neurodata_type_inc: TimeSeries
    doc: TimeSeries object containing time series data on pupil size.
    quantity: '+'

- neurodata_type_def: EyeTracking
  neurodata_type_inc: NWBDataInterface
  default_name: EyeTracking
  doc: Eye-tracking data, representing direction of gaze. WARNING - Use the specialized
    EyeTrackingSeries type for new data, which provides explicit semantics and appropriate
    default units for gaze tracking.
  groups:
  - neurodata_type_inc: SpatialSeries
    doc: SpatialSeries object containing data measuring direction of gaze.
    quantity: '+'

- neurodata_type_def: CompassDirection
  neurodata_type_inc: NWBDataInterface
  default_name: CompassDirection
  doc: With a CompassDirection interface, a module publishes a SpatialSeries object
    representing a floating point value for theta. The SpatialSeries::reference_frame
    field should indicate what direction corresponds to 0 and which is the direction
    of rotation (this should be clockwise). The si_unit for the SpatialSeries should
    be radians or degrees. WARNING - Use the specialized CompassDirectionSeries type
    for new data, which provides explicit semantics and appropriate default units for
    directional heading measurements.
  groups:
  - neurodata_type_inc: SpatialSeries
    doc: SpatialSeries object containing direction of gaze travel.
    quantity: '+'

- neurodata_type_def: Position
  neurodata_type_inc: NWBDataInterface
  default_name: Position
  doc: Position data, whether along the x, x/y or x/y/z axis. WARNING - Use the
    specialized PositionSeries type for new data, which provides explicit semantics
    and appropriate default units for spatial position measurements.
  groups:
  - neurodata_type_inc: SpatialSeries
    doc: SpatialSeries object containing position data.
    quantity: '+'
